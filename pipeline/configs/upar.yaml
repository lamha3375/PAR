# UPAR_UNIFIED Pedestrian Attribute Recognition (PAR) Config

dataset:
  name: UPAR_UNIFIED
  unified_root: "D:\\AI DATASET\\UPAR_UNIFIED"
  image_roots:
    - "D:\\AI DATASET\\3 Datasets"
    - "D:\\AI DATASET"
  img_height: 256
  img_width: 128
  num_attributes: 40

model:
  name: HydraPlus-Net
  backbone: resnet50
  pretrained: true
  num_attributes: 40

training:
  epochs: 10
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.0001
  amp: true
  num_workers: 4
  checkpoint_dir: "D:\\AI DATASET\\UPAR_UNIFIED\\checkpoints"
  reports_dir: "D:\\AI DATASET\\UPAR_UNIFIED\\reports"
